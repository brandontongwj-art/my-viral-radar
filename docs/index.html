<style>

    --card-hi: #151a24;
    --border: #1d2430;
    --border-hi: #2c3546;
    --text: #e8ecf3;
    --muted: #8a94a6;
    --faint: #5b6577;

    --green: #3fd68f;
    --orange: #f0a33f;
    --pink: #ff6b9d;
    --red: #ff5c5c;

    --font: 'Inter', -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scrollbar-color: #232c3b var(--bg); }
  body { background: var(--bg); color: var(--text); font-family: var(--font);
    -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(94,161,255,.3); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #232c3b; border-radius: 8px; }

  .ic { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; fill: none; flex: none; }

  header { position: sticky; top: 0; z-index: 50; background: rgba(10,13,19,.86);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border); padding: 13px 20px 12px; }
  .hrow { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; max-width: 1440px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .mark { width: 31px; height: 31px; border-radius: 9px; display: grid; place-items: center;

    box-shadow: 0 4px 16px rgba(255,92,80,.35); }

  h1 { font-family: var(--disp); font-size: 16.5px; font-weight: 700; letter-spacing: .2px; white-space: nowrap; line-height: 1.15; }
  h1 small { display: block; color: var(--faint); font-family: var(--font); font-weight: 400;
    font-size: 10.5px; letter-spacing: 0; }

  .search { position: relative; }
  .search > .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--faint); width: 13.5px; pointer-events: none; }
  input#fSearch { background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px 8px 32px; font-size: 13px; font-family: var(--font);
    width: 200px; transition: border-color .18s, background .18s; }
  input#fSearch:hover { border-color: var(--border-hi); }
  input#fSearch:focus { border-color: var(--accent); outline: none; }
  input#fSearch::placeholder { color: var(--faint); }

  select, .btn { background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 11px; font-size: 13px; font-family: var(--font);
    cursor: pointer; transition: border-color .18s, background .18s, color .18s;
    display: inline-flex; align-items: center; gap: 6px; }
  select:hover, .btn:hover { border-color: var(--border-hi); background: var(--card-hi); }

  .btn.on { border-color: var(--accent); color: var(--accent); background: rgba(94,161,255,.08); }

  .tabs { display: flex; gap: 7px; flex-wrap: wrap; max-width: 1440px; margin: 12px auto 0; }
  .tab { display: inline-flex; align-items: center; gap: 7px; background: var(--card);
    border: 1px solid var(--border); border-radius: 999px; padding: 6.5px 14px;
    font-size: 13px; color: var(--muted); cursor: pointer; user-select: none;
    transition: border-color .18s, background .18s, color .18s, transform .18s; }
  .tab:hover { border-color: var(--border-hi); color: var(--text); }
  .tab .cnt { font-family: var(--disp); font-weight: 600; font-size: 11px;

    font-variant-numeric: tabular-nums; }

  .tab.on .cnt { background: rgba(255,120,90,.25); }
  body.dragging .tab.droppable { border-style: dashed; border-color: var(--accent); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; max-width: 1440px; margin: 9px auto 0; align-items: center; }

  .chip2.on { border-color: rgba(240,163,63,.6); color: var(--orange); background: rgba(240,163,63,.08); }

  main { max-width: 1440px; margin: 22px auto; padding: 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(305px, 1fr)); gap: 18px; }

  .card { position: relative; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
    transition: transform .22s cubic-bezier(.2,.7,.3,1), border-color .22s, box-shadow .22s;
    animation: fadeUp .45s cubic-bezier(.2,.7,.3,1) both; }

  .card[draggable] { cursor: grab; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .embed { position: relative; width: 100%; aspect-ratio: 4/5; background: #080b10; }
  .embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  .num.x .ic, .num.x b { color: var(--orange); }
  .num.er .ic, .num.er b { color: var(--green); }

  .status.s跳过 { color: var(--red); border-color: rgba(255,92,92,.5); }
  .abtn { display: inline-flex; align-items: center; gap: 5px; background: #0c0f16;
    color: var(--muted); border: 1px solid var(--border); border-radius: 9px;
    padding: 6px 10px; font-size: 11.5px; font-family: var(--font); cursor: pointer;
    text-decoration: none; transition: color .18s, border-color .18s, transform .1s; }

  .abtn:hover { color: var(--accent); border-color: rgba(94,161,255,.5); }

  .more { text-align: center; margin: 28px 0 44px; }

  .more button:hover { border-color: var(--border-hi); background: var(--card-hi); }

  .empty { color: var(--faint); text-align: center; padding: 70px 0; display: flex;

  footer { color: var(--faint); font-size: 11px; text-align: center; padding: 22px; }

pt saying yes. Every time they kind of use the same four words before they anchor the price and say, okay, it is expensive. And as soon as I heard that, I actually started training my team on it and it works especially well when you're younger because people get nervous before they present the price. And so if someone is rich and you say it's expensive, then they're going to think what's expensive for them, which is probably much higher than the price. And so then when you say the price, it actually sounds like less than they thought. So you actually give like a hypothetical anchor, but it's specific to the prospect. Because on the flip side, if someone's poor and they think expensive, then when you do actually say the price, at least they were braced. And there's tons of research about how people are better at receiving bad news if you brace them first.", "brk": "", "tags": "", "bait": true, "type": "Video", "likes": 25993, "comments": 504, "er": 0.51, "followers": 5238511, "date": "2026-11-09", "url": "https://www.instagram.com/p/Dfh7jNKzEmm/", "video": true, "ratio": 0, "score": 0.53, "status": "未处理", "x": 0.9}, {"id": "DeYFThtmkM2", "tracker": "Brandon Viral Radar competitors", "competitor": "edgepropsg", "caption": "A five-room HDB flat at Bedok South Horizon has sold for $1.54 million ($1,266 psf), setting a new record for HDB resale flats in Bedok. \n\nThe 1,216 sq ft flat has about 94 years left on its lease and is near the upcoming Bedok South MRT Station, expected to open by end-2026.\n\nFor buyers, the question is whether a long lease and future MRT access justify the asking price of comparable flats.\n\n#marketupdates #singapore #sgproperty #hdb", "transcript": "", "brk": "", "tags": "marketupdates, singapore, sgproperty, hdb", "bait": false, "type": "Carousel", "likes": 47, "comments": 4, "er": 0.45, "followers": 11453, "date": "2026-10-12", "url": "https://www.instagram.com/p/DeYFThtmkM2/", "video": false, "ratio": 0, "score": 0.52, "status": "未处理", "x petitor": "hormozi", "caption": "Comment \"MAP\" to get a free scaling roadmap.\n\nYou can beat 99% of people without being smarter or luckier, but by being willing to endure pain and uncertainty for longer.", "transcript": "", "brk": "", "tags": "", "bait": true, "type": "Video", "likes": 17748, "comments": 356, "er": 0.35, "followers": 5206179, "date": "2026-10-26", "url": "https://www.instagram.com/p/De-Eguuj167/", "video": true, "ratio": 0, "score": 0.36, "status": "未处理", "x": 0.6}, {"id": "DfnXbEfykOm", "tracker": "Brandon Viral Radar competitors", "competitor": "humphreytalks", "caption": "ESPP stands for Employee Stock Purchase Plan. Do you have an ESPP at your company? Let me know in the comments.", "transcript": "If you get a job offer from NVIDIA or any other big company like that, your offer might be $120,000 of salary and access to something called an ESPP. That stands for Employee Stocked Purchase Plan. It lets you buy your company's stock at a discount, usually a 15% discount. Pretend you put 10% of your salary into that that's $12,000 a year, where your paycheck automatically buys shares of NVIDIA at a 15% discount every 6 month period. Let's say NVIDIA is trading at $100 per share, that means you can buy it at $85 a share, giving you an instant profit. But it gets even better, many plans have something called a look back provision, that means your discount applies to whichever is lower, the price at the start of the 6 month period you're in, or the price at the end. So pretend the stock is at $100 when the period starts, but 6 months later it's at $130. You get 15% off the lower price, so you actually pay $85 a share, and guess what, the stock trades for $130 now. And if the stock drops, you get a 15% off that price instead. Once you buy, you can sell right away and pocket the profit, or you can hold the shares and see if they go up over time. Just know that any profit that you take gets tax like income when you sell. Do you have an ESPP at your company? Let me know in the comments.", "brk": "", "tags": "", "bait": false, "type": "Video", "likes": 3046, "comments": 65, "er": 0.34, "followers": 908005, "date": "2026-11-11", "url": "https://www.instagram.com/p/DfnXbEfykOm/", "video": true, "ratio": 0, "score": 0.36, "status": "未处理", "x": 1.2}, {"id": "DdJ-uichjVS", "tracker": "Brandon Viral Radar competitors", "competitor": "humphreytalks", "caption": "New series dropped 🎙️💰 send this to someone who chooses renting over buying \n\n#Personalfinance #investing", "transcript": "", "brk": "", "tags": "Personalfinance, investing", "bait": false, "type": "Video", "likes": 2760, "comments": 126, "er": 0.32, "followers": 908202, "date": "2026-09-11", "url": "https://www.instagram.com/p/DdJ-uichjVS/", "video": true, "ratio": 0, "score": 0.35, "status": "未处理", "x": 1.1}, {"id": "DdpKCbiSnDQ", "tracker": "Brandon Viral Radar competitors", "competitor": "humphreytalks", "caption": "There are 3 big changes you will notice once you hit $100K! Do you agree or disagree? Let me know in the comments.", "transcript": "After you cross $50,000, the next big money milestone is $100K, and there are three big changes you will notice once you hit this number. The first is that your portfolio starts to pull its weight. At 8% average returns, $100K invested earns about $8,000 a year, or roughly $670 a month. If previously you were contributing $1,000 a month, that means the market is now doing two thirds of the work of what you would usually do on your own. Number two is that your identity will start to shift. You're not someone trying to invest anymore. You are an investor, and you've proven that you know the system to get you to six figures. And now the only thing stopping you from getting to seven figures is simply just time and contributing more. And the third is that market dips will really start to hurt. So for example, a 20% dip on a $1,000 balance is $200, but on $100K, it's $20,000. If you were saving $1,000 a month, that's 20 months of savings gone on paper due to a correction or a pullback in the market. So you really can't think in absolute dollar terms anymore. You really need to start thinking in percentages. The next milestone is what I call the crossover point, and that's where your money starts to earn more than what you save in the market. And that probably comes really soon. So if you want to see that video, make sure to follow so you don't miss it.", "brk": "", "tags": "", "bait": false, "type": "Video", "likes": 2964, "comments": 41, "er": 0.33, "followers": 908005, "date": "2026-09-23", "url": "https://www.instagram.com/p/DdpKCbiSnDQ/", "video": true, "ratio": 0, "score": 0.34, "status": "未处理", "x": 1.1}, {"id": "DfaGTlsoI7m", "tracker": "Brandon Viral Radar competitors", "competitor": "hormozi", "caption": "Comment “SALES” to join the waitlist for my $100M Sales Teams masterclass. It’s my big thing for the year. Just in time for the holidays. It covers how to scale your sales teams from first hire to sales organization. Script. Recruit. Train. Manage. Setters. Closers. Managers. The whole enchilada.\n\nIt’s 🔥", "transcript": "The video sales letter has all these parts to it. So you have your intro, which is proof, pain, promise, plan, and picture. You then go into old way versus new way, or them versus us, or hidden problem that's called the unique mechanism. Once you say, hey, this is our way that's different, you then go into FAQs, which is, now that sounds amazing, but people ask the next question. And then you just resolve every concern that someone has with these four steps, which is what they think, why it's wrong, what's right, and then proof. And you keep looping that until the end until you've resolved all the concerns. Then you make a small call to action that's like, hey, how many square foot is your kitchen? What size t-shirt do you want? Do you want a small, medium, large, whatever? And so we want them to give us something that makes them think that whatever our sales consultation can be more personalized to them. It also shows that they actually watch the video. And then the rest of your videos should just be proof salad. Instead of writing a book this year, I made the sales team complete scaling guide, and I want to gift it to you. If you want it, put sales below. We'll add you to the wait list. It's coming out soon.", "brk": "", "tags": "", "bait": true, "type": "Video", "likes": 7543, "comments": 3368, "er": 0.21, "followers": 5238511, "date": "2026-11-06", "url": "https://www.instagram.com/p/DfaGTlsoI7m/", "video": true, "ratio": 0, "score": 0.34, "status": "未处理", "x": 0.6}, {"id": "DefC6jdp-ow", "tracker": "Brandon Viral Radar competitors", "competitor": "humphreytalks", "caption": "Overfunding your emergency fund is a wealth killer. Do you agree or disagree? Let me know in the comments.", "transcript": "This is too much to have in your emergency fund. Assuming you're burned is $4,000 a month, overfunding your emergency fund like this is a wealth killer. I know people keeping $80,000 or more in a high-evaluating account because it makes them feel better about themselves and they like the idea that they have more of a buffer between them and a catastrophic emergency. But when you have 16 to 24 months of expenses parked in cash, that excess money costs you a lot in terms of opportunity cost. Say your monthly expenses are $4,000 a month, a six-month emergency fund is $24,000 and a 16-month one would be $64,000. That extra 40K sitting in a high-yield savings account at 3.5% instead of being invested at roughly 8% to 9% could cost you over $145,000 over 20 years. The point here is to be intentional about how much you actually need in your savings account. Anything more than six months that you're holding in cash just in case could be a symptom of having a scarcity mindset. How much do you have in your savings account and do you have this overfunding problem? Let me know in the comments.", "brk": "", "tags": "", "bait": false, "type": "Video", "likes": 2476, "comments": 166, "er": 0.29, "followers": 908005, "date": "2026-10-14", "url": "https://www.instagram.com/p/DefC6jdp-ow/", "video": true, "ratio": 0, "score": 0.33, "status": "未处理", "x": 1.1}, {"id": "Dey6tv0GI9K", "tracker": "Brandon Viral Radar competitors", "competitor": "stackedhomes", "caption": "Inheriting a $5 million semi-D sounds like a win. For two brothers, it ended in court over $600,000.\n\nTwo brothers inherited a semi-D on Eng Kong Road in equal shares from their mother. In 2021, an offer of $5 million came in, more than 10% above the bank’s $4.5 million valuation, so one brother was keen to sell.\n\nThe other would only sign if the promise went in writing: $600,000 of the proceeds for their two other brothers, who were left out of the will. The one keen to sell signed after a shouting match, then said it was under duress.\n\nThe High Court held that the note was a binding contract, so each brother gives up $300,000, or 12% of his $2.5 million half. The rent and commission claims largely came down to the same thing, who had put what in writing. The brother who held out lost $28,000 in claimed rent because his own WhatsApp messages showed he had agreed to a rent-free stay, and the other had nothing to show his brother agreed to his renovation costs.\n\nWhen siblings inherit a ", "transcript": "", "brk": "", "tags": "StackedHomes, SingaporeProperty, PropertyLaw, InheritedProperty", "bait": false, "type": "Carousel", "likes": 765, "comments": 30, "er": 0.3, "followers": 268427, "date": "2026-10-22", "url": "https://www.instagram.com/p/Dey6tv0GI9K/", "video": false, "ratio": 0, "score": 0.32, "status": "未处理", "x": 2.7}, {"id": "Ddj8BIaBUfP", "tracker": "Brandon Viral Radar competitors", "competitor": "humphreytalks", "caption": "Controversial take: pay off the 3% mortgage early. What are you doing?", "transcript": "There's a rare breed of person who paid off a 3% mortgage early and every finance guy on the internet called them an idiot for it. Welcome back to dumb smart money. If you like digging into money moves that sound wrong but actually hold up, this series is for you. The person who pays off cheap debt already knows what the spreadsheet says. They know they probably left a couple hundred thousand dollars on the table over 10 years. They just decided that it wasn't the only number that mattered. What makes this person rare is that they know that two things can be true at the same time. Number one, they know that the market usually wins over 10 years. And number two, they also know that they don't get a redo if they're 10 years of the bad ones. You can be good at math and optimize everything and still be one layoff away from a real problem. And this person looked at that scenario and just removed that possibility completely. They required monthly expenses didn't go down. They just went away and any layoff or bad market year is no longer a worry to them. These people sleep differently than the rest of us. And if you know somebody who paid theirs off, send this to them and tell them that they weren't wrong. And if that's you, the math didn't fail you. You just decided debt wasn't part of the equation.", "brk": "", "tags": "", "bait": false, "type": "Video", "likes": 2270, "comments": 167, "er": 0.27, "followers": 908005, "date": "2026-09-21", "url": "https://www.instagram.com/p/Ddj8BIaBUfP/", "video": true, "ratio": 0, "score": 0.31, "status": "未处理", "x": 1.0}, {"id": "DfCUKTSiQu5", "tracker": "Brandon Viral Radar competitors", "competitor": "stackedhomes", "caption": "163 properties went under the hammer in the third quarter of 2026. Only nine sold.\n\nThat's a 5.5% success rate, and four of those nine sales were the Singapore money laundering case properties everyone was talking about. Martin Modern and Wallich Residence both sold below their opening bids.\n\nHere's the part that matters if you're watching this market: those four properties alone made up roughly two thirds of t ption for anything less than that amount. And number four, your biggest risk isn't financial anymore, it's psychological. At $5 million, the question isn't, do I have enough money? It's more like, what is all this money even for? The happiest financially successful people I know are the ones who have the answers to what is this all for and have had plans for their money long before they were retired. This is the end of the Financial Milestone Series. If you enjoyed it, please give me a follow and comment your thoughts.", "brk": "", "tags": "", "bait": false, "type": "Video", "likes": 2268, "comments": 77, "er": 0.26, "followers": 908005, "date": "2026-11-02", "url": "https://www.instagram.com/p/DfQIb8gyod1/", "video": true, "ratio": 0, "score": 0.28, "status": "未处理", "x": 0.9}, {"id": "DfmmA5doz3m", "tracker": "Brandon Viral Radar competitors", "competitor": "supramanwho", "caption": "🎾 POV: You just found your new favourite tennis spot in Bangkok.\n\nWelcome to @serveandsocial_bkk , the 1st fully branded Wilson’s indoor tennis playground in SEA and honestly, tennis lovers will understand the obsession 🎾\n\nSix indoor courts, impressive high ceilings, clean aesthetics and that unmistakable Wilson identity.\n\nBut it’s the little details that make it special.\n\nThe tournament-style lighting, generous space behind the baseline, room to chase those impossible shots, and that satisfying sound when you finally hit the sweet spot. 🤌\n\nNo Bangkok heat. No tropical rain. No weather excuses.\n\nJust fresh overgrips, perfectly tied shoes, new Wilson balls and the promise of a quick one-hour session that somehow turns into three. 😂\n\nWhether you’re working on your serve, fighting for every point or just enjoying rallies with friends, this place gets the tennis lifestyle right.\n\nGood courts. Great atmosphere. Dangerous for your free time. 🎾\n\n📍 Serve & Social, Bangkok 🇹🇭\n\nNow excuse me whi", "transcript": "I just wanna make a lot of money and do my own housewives Do it, ackedhomes", "caption": "Singapore investors typically earn 2 to 3% rental yield at home. Some Osaka properties are hitting 5%.\n\nThat gap is why so many Singaporeans are looking at Japan’s third-largest city. The yen is weak, borrowing costs are still low by global standards, and Osaka’s new condo supply just hit its lowest level in over a decade. Less supply, more demand, higher rents.\n\nForeign owners also get the same legal ownership rights as locals, with no extra stamp duty, no residency requirement and no special approval needed.\n\nInstitutions are already in. CDL bought a 256-room hotel in Osaka’s Shinsaibashi district for JPY 8.5 billion in 2023, then sold it to Blackstone for JPY 14 billion in 2025. Blackstone and Orix JREIT have been adding to their Osaka holdings too.\n\nCloser to the castle, freehold units in Chuo Ward start from $396,000, and the area is still more accessible than Shinsaibashi.\n\nAt 5% against 2 to 3% at home, the pull is easy to understand. Would Singapore investors buy overseas for y", "transcript": "", "brk": "", "tags": "StackedHomes, SingaporeProperty, OverseasProperty, OsakaRealEstate", "bait": false, "type": "Carousel", "likes": 195, "comments": 6, "er": 0.07, "followers": 268296, "date": "2026-11-01", "url": "https://www.instagram.com/p/DfMn-WOkoxo/", "video": false, "ratio": 0, "score": 0.08, "status": "未处理", "x": 0.7}, {"id": "DfUNgjTiT-I", "tracker": "Brandon Viral Radar competitors", "competitor": "stackedhomes", "caption": "Singaporeans are taking smaller housing loans, but does that necessarily mean they're taking on less financial risk?\n\nA larger down payment can reduce monthly mortgage repayments, but the money has to come from somewhere. For some buyers, that means using more of their own savings or CPF. For others, it may mean relying on financial help from their parents.\n\nThis raises another question about family-funded property purchases. When parents contribute towards a home, is the money a gift, a loan, o an price and median $ psf:\nUnder 600 sq ft: $880,000, $1,773 psf, 1,157 resold.\n600 to 799 sq ft: $1.30M, $1,890 psf, 1,588 resold.\n800 to 999 sq ft: $1.59M, $1,767 psf, 1,474 resold.\n1,000 to 1,199 sq ft: $1.85M, $1,695 psf, 1,523 resold.\n1,200 to 1,599 sq ft: $2.33M, $1,738 psf, 2,008 resold.\n1,600 to 1,999 sq ft: $3.03M, $1,758 psf, 653 resold.\n2,000 sq ft and up: $4.60M, $1,825 psf, 543 resold.\nLocation, age and tenure differ between sizes. September counts contracts lodged by 20 Oct.\nSource: URA private residential transactions, read 20 Oct 2026 (contracts lodged by that date).\n#sgproperty #resalecondo #condo\n#propertylimbrothers #plb", "transcript": "", "brk": "", "tags": "sgproperty, resalecondo, condo, propertylimbrothers, plb", "bait": false, "type": "Image", "likes": 3, "comments": 0, "er": 0.01, "followers": 40837, "date": "2026-11-13", "url": "https://www.instagram.com/p/Dfq5QqriMPn/", "video": false, "ratio": 0, "score": 0.01, "status": "未处理", "x": 0.7}]</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const SUPA = 'https://hblmizbavguctunhbftv.supabase.co';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhibG1pemJhdmd1Y3R1bmhiZnR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyMDIzMTMsImV4cCI6MjEwOTc3ODMxM30.wOJOFi38mkoQ_lHRQ8HBUvXDhNSLFjvVLSUt__DiZDs';
const STATUSES = ["未处理", "拍摄中", "已处理", "跳过"];
const SL = {'全部':'All','未处理':'To review','拍摄中':'Filming','已处理':'Done','跳过':'Skipped'};
const L = s => SL[s] || s;
document.getElementById('updated').textContent = 'Updated 2026-11-16 18:10 (GMT+8)';
const PAGE = 48;
let shown = PAGE;
let videoOnly = false;
let curTab = '全部';

const $ = id => document.getElementById(id);
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : String(n);
const getKey = () => ANON;  // anon key is baked in — safe, can only change status
const I = n => '<svg class="ic"><use href="#i-' + n + '"/></svg>';
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const byRec = {}; DATA.forEach(d => byRec[d.id] = d);
const TRENDS = [["singapore", 9], ["singaporeproperties", 5], ["realestateinvesting", 5], ["realestate", 5], ["realestategoals", 5], ["singaporeproperty", 3], ["propertygiant", 2], ["singaporerealtorsinc", 2], ["property", 2], ["newlaunch", 2]];
DATA.forEach(d => {
  d.days = d.date ? Math.max(0, Math.floor((Date.now() - new Date(d.date + 'T00:00:00')) / 864e5)) : null;
  d.horse = d.followers > 0 && d.followers < 50000 && ((d.x || 0) >= 2 || d.score >= 10);
});
const PRESETS = [
  { k: 'px', icon: 'trend', label: 'Real viral ×2+', f: d => (d.x || 0) >= 2 },
  { k: 'pn', icon: 'star', label: 'Last 7 days', f: d => d.days !== null && d.days <= 7 },
  { k: 'ph', icon: 'zap', label: 'Dark horse', f: d => d.horse },
  { k: 'pb', icon: 'magnet', label: 'Comment-bait', f: d => d.bait },
];
const presetOn = {};

function toast(msg, ok) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  t.style.borderColor = ok ? 'var(--green)' : 'var(--red)';
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
}

// filters
const comps = [...new Set(DATA.map(d => d.competitor))].sort();
comps.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = '@'+c; $('fComp').appendChild(o); });
[...new Set(DATA.map(d => d.tracker))].forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; $('fTracker').appendChild(o); });

function matchQ(d) {
  const q = ($('fSearch').value || '').trim().toLowerCase();
  return !q || (d.caption + ' ' + (d.tags || '') + ' ' + (d.transcript || '') + ' ' + (d.brk || '') + ' ' + d.competitor).toLowerCase().includes(q);
}

function basePool() {
  const t = $('fTracker').value, c = $('fComp').value;
  return DATA.filter(d => (!t || d.tracker === t) && (!c || d.competitor === c) && (!videoOnly || d.video)
    && matchQ(d) && PRESETS.every(p => !presetOn[p.k] || p.f(d)));
}

function filtered() {
  const s = $('fSort').value;
  let arr = basePool().filter(d => curTab === '全部' || d.status === curTab);
  const key = { score:'score', er:'er', comments:'comments', likes:'likes', x:'x' }[s];
  if (s === 'date') arr.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  else arr.sort((a,b) => (b[key]||0) - (a[key]||0));
  return arr;
}

let dragRec = null;

function renderTabs() {
  const pool = basePool();
  const counts = { '全部': pool.length };
  STATUSES.forEach(s => counts[s] = pool.filter(d => d.status === s).length);
  $('tabs').innerHTML = '';
  ['全部', ...STATUSES].forEach(name => {
    const el = document.createElement('div');
    el.className = 'tab' + (curTab === name ? ' on' : '') + (name !== '全部' ? ' droppable' : '');
    el.innerHTML = esc(L(name)) + ' <span class="cnt">' + counts[name] + '</span>';
    el.onclick = () => { curTab = name; shown = PAGE; render(); };
    if (name !== '全部') {
      el.ondragover = e => { if (dragRec) { e.preventDefault(); el.classList.add('over'); } };
      el.ondragleave = () => el.classList.remove('over');
      el.ondrop = e => {
        e.preventDefault(); el.classList.remove('over');
        const d = byRec[dragRec]; dragRec = null;
        if (d && d.status !== name) setStatus(d, name);
      };
    }
    $('tabs').appendChild(el);
  });
}

const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const el = e.target, pid = el.dataset.pid;
      if (!el.querySelector('iframe')) {
        const f = document.createElement('iframe');
        f.src = 'https://www.instagram.com/p/' + pid + '/embed/';
        f.loading = 'lazy'; f.allow = 'autoplay; encrypted-media';
        el.appendChild(f);
      }
      io.unobserve(el);
    }
  });
}, { rootMargin: '400px' });

async function setStatus(d, val) {
  try {
    const r = await fetch(SUPA + '/rest/v1/posts?post_id=eq.' + encodeURIComponent(d.id), {
      method: 'PATCH',
      headers: { 'apikey': ANON, 'Authorization': 'Bearer ' + ANON, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ status: val })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    d.status = val;
    cacheStatus(d.id, val);
    toast('✓ @' + d.competitor + ' moved to "' + L(val) + '"', true);
  } catch (e) {
    toast('Update failed: ' + e.message + (String(e.message).includes('401') || String(e.message).includes('403') ? ' — invalid key?' : ''), false);
  }
  render();
}

function card(d, idx) {
  const el = document.createElement('div');
  el.className = 'card' + ((d.x || 0) >= 2 ? ' outlier' : '');
  el.style.animationDelay = Math.min(idx % PAGE, 14) * 30 + 'ms';
  el.draggable = true;
  el.ondragstart = e => {
    dragRec = d.id;
    e.dataTransfer.effectAllowed = 'move';
    el.classList.add('lifting');
    document.body.classList.add('dragging');
  };
  el.ondragend = () => {
    el.classList.remove('lifting');
    document.body.classList.remove('dragging');
    dragRec = null;
  };
  const typeIcon = d.video ? 'video' : (d.type === 'Carousel' ? 'layers' : 'image');
  const days = d.days, horse = d.horse;
  const ago = days === null ? '' : (days === 0 ? 'today' : days + 'd ago');
  const lines = (d.caption || '').split('\n').map(l => l.trim()).filter(Boolean);
  const hook = lines[0] || '';
  const tr = (d.transcript && d.transcript !== '(转录失败)' && d.transcript !== '(无口播内容)') ? d.transcript : '';
  el.innerHTML = `
    <div class="embed" data-pid="${d.id}"><div class="ph"><svg class="ic"><use href="#i-${typeIcon}"/></svg></div></div>
    <div class="meta">
      <div class="row1">
        <span class="handle" title="Drag onto a tab above to sort it">${I('grip')}</span>
        <a class="who" href="https://www.instagram.com/${d.competitor}/" target="_blank">@${d.competitor}</a>
        <span class="badge">${d.type || '-'}</span>
        ${days !== null && days <= 7 ? '<span class="badge bnew">' + I('star') + 'New</span>' : ''}
        ${horse ? '<span class="badge bhorse">' + I('zap') + 'Dark horse</span>' : ''}
        ${d.bait ? '<span class="badge bbait" title="Comment-keyword funnel — comments are inflated by the bait; study the funnel">' + I('magnet') + 'Comment-bait</span>' : ''}
        <span class="date" title="${d.date || ''}">${ago}</span>
      </div>
      <div class="nums">
        <span class="num hot" title="Viral Score">${I('flame')}<b>${d.score}</b></span>
        ${(d.x || 0) >= 2 ? '<span class="num x" title="How many times above this account&#39;s average">' + I('trend') + '<b>×' + d.x + '</b></span>' : ''}
        <span class="num er" title="Engagement Rate">${I('pct')}<b>${d.er}%</b></span>
        <span class="num" title="Likes">${I('heart')}<b>${d.likes > 0 ? fmt(d.likes) : 'hidden'}</b></span>
        <span class="num" title="Comments">${I('msg')}<b>${fmt(d.comments)}</b></span>
        <span class="num" title="Followers">${I('users')}<b>${fmt(d.followers)}</b></span>
      </div>
      <div class="cap" onclick="this.classList.toggle('open')"></div>
      ${d.brk ? '<div class="ai" onclick="this.classList.toggle(&quot;open&quot;)"></div>' : ''}
      <div class="srow"><label>Status</label><select class="status btn s${d.status}"></select>
        <button class="abtn copy" title="Copy full caption">${I('copy')}Caption</button>
        ${tr ? '<button class="abtn mic" title="Copy the spoken script">' + I('mic') + 'Script</button>' : ''}
        <button class="abtn brief" title="Copy a filming brief (stats + hook + caption + script)">${I('clip')}Brief</button>
        <a class="abtn" href="${d.url}" target="_blank" title="Open the original Instagram post">${I('ext')}</a></div>
    </div>`;
  const capEl = el.querySelector('.cap');
  const restTxt = lines.slice(1).join('\n');
  capEl.innerHTML = hook ? '<b>' + esc(hook) + '</b>' + (restTxt ? '<br>' + esc(restTxt).replace(/\n/g, '<br>') : '') : '';
  const aiEl = el.querySelector('.ai');
  if (aiEl) aiEl.innerHTML = '<b>💡 AI breakdown</b><br>' + esc(d.brk).split(String.fromCharCode(10)).join('<br>');
  const sel = el.querySelector('.status');
  STATUSES.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = L(s); sel.appendChild(o); });
  sel.value = d.status;
  sel.onchange = () => setStatus(d, sel.value);
  el.querySelector('.copy').onclick = () =>
    navigator.clipboard.writeText(d.caption || '').then(() => toast('✓ Caption copied', true));
  const micBtn = el.querySelector('.mic');
  if (micBtn) micBtn.onclick = () =>
    navigator.clipboard.writeText(tr).then(() => toast('✓ Script copied', true));
  el.querySelector('.brief').onclick = () => {
    const NL = String.fromCharCode(10);
    const parts = ['🎬 Viral reference @' + d.competitor + ((d.x || 0) >= 2 ? ' (×' + d.x + ' own average)' : ''),
      '📊 🔥' + d.score + ' | ER ' + d.er + '% | ❤️ ' + (d.likes > 0 ? fmt(d.likes) : 'hidden') +
      ' | 💬 ' + fmt(d.comments) + ' | 👥 ' + fmt(d.followers) + (ago ? ' | ' + ago : ''),
      '🔗 ' + d.url, '✍️ Hook: ' + hook];
    if (d.brk) parts.push('——— AI breakdown ———', d.brk);
    if (tr) parts.push('——— Spoken script ———', tr);
    parts.push('——— Full caption ———', d.caption || '');
    navigator.clipboard.writeText(parts.join(NL)).then(() => toast('✓ Brief copied — send it straight to filming/editing', true));
  };
  io.observe(el.querySelector('.embed'));
  return el;
}

function render() {
  renderTabs();
  const arr = filtered();
  const grid = $('grid'); grid.innerHTML = '';
  arr.slice(0, shown).forEach((d, i) => grid.appendChild(card(d, i)));
  $('empty').style.display = arr.length ? 'none' : '';
  $('moreWrap').style.display = arr.length > shown ? '' : 'none';
}


function applyStatusCache() {
  try {
    const c = JSON.parse(localStorage.getItem('st_cache') || '{}');
    Object.keys(c).forEach(rid => { const d = byRec[rid]; if (d) d.status = c[rid]; });
  } catch (e) {}
}

function cacheStatus(rid, val) {
  try {
    const c = JSON.parse(localStorage.getItem('st_cache') || '{}');
    c[rid] = val; localStorage.setItem('st_cache', JSON.stringify(c));
  } catch (e) {}
}

// live status refresh (so weekly-baked page shows current statuses)
async function refreshStatuses() {
  applyStatusCache(); render();  // last-known statuses first
  if (Date.now() - (+localStorage.getItem('st_ts') || 0) < 600000) return;  // 10-min throttle
  localStorage.setItem('st_ts', String(Date.now()));
  const fresh = {};
  try {
    const r = await fetch(SUPA + '/rest/v1/posts?select=post_id,status', { headers: { 'apikey': ANON, 'Authorization': 'Bearer ' + ANON } });
    if (!r.ok) return;
    (await r.json()).forEach(row => {
      const d = byRec[row.post_id];
      if (d) d.status = row.status || '未处理';
      if (row.status && row.status !== '未处理') fresh[row.post_id] = row.status;
    });
    localStorage.setItem('st_cache', JSON.stringify(fresh));
    render();
  } catch (e) {}
}

['fTracker','fComp','fSort'].forEach(id => $(id).onchange = () => { shown = PAGE; render(); });
$('fSearch').oninput = () => { shown = PAGE; render(); };
$('fVideo').onclick = () => { videoOnly = !videoOnly; $('fVideo').classList.toggle('on', videoOnly); shown = PAGE; render(); };
$('moreBtn').onclick = () => { shown += PAGE; render(); };

// preset quick filters
$('presets').innerHTML = '<span class="lbl">Quick filters</span>';
PRESETS.forEach(p => {
  const c = document.createElement('span'); c.className = 'chip2';
  c.innerHTML = I(p.icon) + esc(p.label);
  c.onclick = () => { presetOn[p.k] = !presetOn[p.k]; c.classList.toggle('on', presetOn[p.k]); shown = PAGE; render(); };
  $('presets').appendChild(c);
});

// trending hashtags among outlier posts
if (TRENDS.length) {
  $('trends').innerHTML = '<span class="lbl">Trending tags</span>';
  TRENDS.forEach(([tag, n]) => {
    const c = document.createElement('span'); c.className = 'chip2';
    c.textContent = '#' + tag + ' ' + n;
    c.onclick = () => { $('fSearch').value = $('fSearch').value === tag ? '' : tag; shown = PAGE; render(); };
    $('trends').appendChild(c);
  });
} else { $('trends').style.display = 'none'; }

render();
refreshStatuses();
</script>
</body>
